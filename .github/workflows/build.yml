name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Los runners ubuntu-latest ya traen el Android SDK preinstalado.
      # NO se usa android-actions/setup-android porque intenta instalar el
      # paquete 'tools', que ya no existe, y hace fallar el job.
      - name: Install required SDK components
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true

      # Decodifica el keystore desde el Secret para que TODOS los builds queden
      # firmados con LA MISMA clave. Asi se puede actualizar con
      # "pm install -r" sin desinstalar y sin perder datos.
      - name: Restore signing keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/tb.jks"
          echo "Keystore restaurado: $(stat -c %s "$RUNNER_TEMP/tb.jks") bytes"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PKEYSTORE_PATH="$RUNNER_TEMP/tb.jks" \
            -PKEYSTORE_PASSWORD="${{ secrets.KEYSTORE_PASSWORD }}" \
            -PKEY_ALIAS="${{ secrets.KEY_ALIAS }}" \
            -PKEY_PASSWORD="${{ secrets.KEY_PASSWORD }}"

      - name: Verify APK signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -5

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TransferBubble-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error